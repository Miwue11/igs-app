# Arranca la versión completa (Express + MongoDB) igual que en Render y prueba lo básico de la API.
name: Comprobar servidor completo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servidor:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      NODE_ENV: production
      URI_MONGODB: mongodb://localhost:27017/igs
      SECRETO_JWT: clave-solo-para-la-prueba-de-ci
      FOTOS_EN_MONGO: 'true'
      SEMBRAR_DEMO_SI_VACIA: 'true'
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar y compilar (como en Render)
        run: npm ci --include=dev && npm run build

      - name: Arrancar el servidor
        run: |
          npm start -w servidor > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/api/servicios > /dev/null && break; sleep 1; done
          cat servidor.log

      - name: Probar la API (flujo cliente → IGS)
        run: |
          set -e
          B=http://localhost:4000
          # Hace una petición y comprueba el código HTTP esperado. Deja la respuesta en r.json.
          pedir() { esperado=$1; shift; codigo=$(curl -s -o r.json -w '%{http_code}' "$@"); cat r.json; echo; \
            if [ "$codigo" != "$esperado" ]; then echo "✗ esperaba $esperado y llegó $codigo"; exit 1; fi; }
          campo() { node -e "const d=require('./r.json');console.log($1)"; }
          JSON='Content-Type: application/json'

          echo "→ Web y certificado de demo"
          curl -fs $B/ | grep -q '<div id="root">'
          curl -fs $B/api/productos/IGS-2026-000001 | grep -q 'PRISTINE'
          curl -fs $B/api/productos/IGS-2026-000001 | grep -q '/ejemplos/slab-trasera.webp'
          curl -fs -o /dev/null -w '%{content_type}\n' $B/ejemplos/slab-frontal.webp | grep -q 'image/webp'

          echo "→ Sin cookie no hay sesión: un visitante nuevo nunca entra con la cuenta de otro"
          pedir 401 $B/api/acceso/yo
          curl -s -D - -o /dev/null $B/api/servicios | grep -qi 'cache-control: no-store'

          echo "→ El cliente crea un envío declarando sus cartas"
          pedir 200 -c cliente.txt -H "$JSON" -d '{"email":"cliente@igs.demo","contrasena":"Igs-demo-2026"}' $B/api/acceso/entrar
          pedir 400 -b cliente.txt -H "$JSON" -d '{"servicio":"STD","articulos":[{"nombre":"Lugia","valorDeclarado":900}]}' $B/api/pedidos
          pedir 400 -b cliente.txt -H "$JSON" -d '{"servicio":"BLQ","articulos":[{"nombre":"Pikachu","valorDeclarado":20}]}' $B/api/pedidos
          pedir 201 -b cliente.txt -H "$JSON" \
            -d '{"servicio":"STD","articulos":[{"nombre":"Pikachu","expansion":"Base Set","anio":1999,"numero":"58/102","valorDeclarado":40,"imagen":"https://assets.tcgdex.net/en/base/base1/58/low.webp"},{"nombre":"Mew","valorDeclarado":25,"imagen":"https://malicioso.example/x.png"}]}' $B/api/pedidos
          NUEVO=$(campo d.codigo)
          [ "$(campo d.articulos[0].imagen)" = "https://assets.tcgdex.net/en/base/base1/58/low.webp" ] || { echo "✗ no se guardó la imagen oficial"; exit 1; }
          [ "$(campo d.articulos[1].imagen)" = "null" ] || { echo "✗ se guardó una imagen de un origen no permitido"; exit 1; }
          [ "$(campo d.fechaLimite)" = "null" ] || { echo "✗ el plazo no debería empezar todavía"; exit 1; }
          [ "$(campo d.importe.total)" = "45" ] || { echo "✗ importe incorrecto"; exit 1; }

          echo "→ IGS no puede saltarse estados"
          pedir 200 -c trabajador.txt -H "$JSON" -d '{"email":"trabajador@igs.demo","contrasena":"Igs-demo-2026"}' $B/api/acceso/entrar
          pedir 409 -b trabajador.txt -X PATCH -H "$JSON" -d '{"estado":"completado"}' $B/api/pedidos/$NUEVO/estado
          pedir 200 -b trabajador.txt -X PATCH -H "$JSON" -d '{"estado":"recibido"}' $B/api/pedidos/$NUEVO/estado
          [ "$(campo d.fechaLimite)" != "null" ] || { echo "✗ al recibirlo debería empezar el plazo"; exit 1; }

          echo "→ No se publica PED-0001 con artículos pendientes"
          pedir 409 -b trabajador.txt -X PATCH -H "$JSON" -d '{"estado":"completado"}' $B/api/pedidos/PED-0001/estado

          echo "→ Gradear el artículo 0 con foto: nota calculada PRISTINE y foto en MongoDB"
          printf '\x89PNG\r\n\x1a\n' > foto.png
          DATOS='{"pedido":"PED-0001","articulo":0,"nombre":"Pikachu","marca":"Pokémon","categoria":"tcg","subnotas":{"centrado":10,"esquinas":10,"bordes":10,"superficie":10}}'
          pedir 201 -b trabajador.txt -F "datos=$DATOS" -F 'anverso=@foto.png;type=image/png' $B/api/productos
          [ "$(campo d.etiquetaGrado)" = "PRISTINE" ] && [ "$(campo d.nota)" = "10" ]
          CERT=$(campo d.idCertificado)
          UV=$(campo d.codigoUV)
          echo "$UV" | grep -Eq '^[0-9A-Z]{4}-[0-9A-Z]{4}$' || { echo "✗ falta el código UV al publicar"; exit 1; }
          FOTO=$(campo d.imagenes.anverso)
          curl -fs -o /dev/null -w '%{content_type}\n' $B$FOTO | grep -q 'image/png'

          echo "→ Código UV: no sale en la ficha pública y solo el correcto es válido"
          pedir 200 $B/api/productos/$CERT
          grep -q "$UV" r.json && { echo "✗ la ficha pública revela el código UV"; exit 1; }
          pedir 200 -H "$JSON" -d "{\"codigo\":\"$UV\"}" $B/api/productos/$CERT/verificar-uv
          [ "$(campo d.valido)" = "true" ] || { echo "✗ el código UV correcto no se acepta"; exit 1; }
          pedir 200 -H "$JSON" -d '{"codigo":"0000-0000"}' $B/api/productos/$CERT/verificar-uv
          [ "$(campo d.valido)" = "false" ] || { echo "✗ se acepta un código UV falso"; exit 1; }
          pedir 400 -H "$JSON" -d '{"codigo":"abc"}' $B/api/productos/$CERT/verificar-uv
          pedir 401 $B/api/productos/$CERT/codigo-uv

          echo "→ El mismo artículo no se puede gradear dos veces"
          pedir 409 -b trabajador.txt -F "datos=$DATOS" $B/api/productos

          echo "→ Subnotas 10/10/10/9,5 → 10 GEM MINT (dorada)"
          DATOS2='{"pedido":"PED-0001","articulo":1,"nombre":"Blastoise","marca":"Pokémon","categoria":"tcg","subnotas":{"centrado":10,"esquinas":10,"bordes":10,"superficie":9.5}}'
          pedir 201 -b trabajador.txt -F "datos=$DATOS2" $B/api/productos
          [ "$(campo d.etiquetaGrado)" = "GEM MINT" ] && [ "$(campo d.nota)" = "10" ]

          echo "→ Artículo no gradeable"
          pedir 200 -b trabajador.txt -H "$JSON" -d '{"motivo":"Posible falsificación"}' $B/api/pedidos/PED-0001/articulos/2/no-gradeable
          echo "Todo correcto"

      - name: Registro del servidor
        if: always()
        run: cat servidor.log
